<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lou Garou — Mon Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafbfc;--dark:#0f172a;--blue:#0369a1;--green:#059669;--gray:#64748b;--light:#f1f5f9;--border:#e2e8f0;--white:#fff;--font:system-ui,-apple-system,sans-serif;--serif:'Georgia',serif}
body{background:var(--bg);color:var(--dark);font-family:var(--font);min-height:100vh}
.nav{background:var(--dark);padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
.nav-brand{color:var(--white);font-size:20px;font-weight:800;font-family:var(--serif);display:flex;align-items:center;gap:10px}
.nav-user{display:flex;align-items:center;gap:16px}
.nav-user span{color:#94a3b8;font-size:14px}
.btn-logout{background:none;border:1px solid #475569;color:#94a3b8;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-logout:hover{border-color:#94a3b8;color:var(--white)}
.auth-screen{max-width:400px;margin:80px auto;padding:40px;background:var(--white);border-radius:20px;border:1px solid var(--border)}
.auth-screen h2{font-family:var(--serif);font-size:28px;margin-bottom:8px;text-align:center}
.auth-screen p{color:var(--gray);text-align:center;margin-bottom:32px;font-size:15px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--gray);margin-bottom:6px;font-weight:500}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--font);outline:none;background:var(--light)}
.form-group input:focus{border-color:var(--blue);background:var(--white)}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#0c4a6e,var(--blue) 40%,var(--green));color:var(--white);border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary:hover{opacity:.9}
.auth-toggle{text-align:center;margin-top:20px;font-size:14px;color:var(--gray)}
.auth-toggle a{color:var(--blue);cursor:pointer;text-decoration:underline}
.auth-error{color:#ef4444;font-size:13px;text-align:center;margin-top:12px;display:none}
.dash{max-width:1100px;margin:0 auto;padding:32px}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.dash-header h1{font-family:var(--serif);font-size:32px}
.btn-search{background:linear-gradient(135deg,#0c4a6e,var(--blue) 40%,var(--green));color:var(--white);border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.profile-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
.profile-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}
.profile-criteria{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 14px;background:var(--light);border-radius:50px;font-size:13px;color:var(--gray);font-weight:500}
.tag-blue{background:rgba(3,105,161,.1);color:var(--blue)}
.score-badge{text-align:center}
.score-num{font-size:36px;font-weight:800;color:var(--blue);font-family:var(--serif);line-height:1}
.score-grade{display:inline-block;padding:3px 12px;border-radius:50px;font-size:11px;font-weight:700;color:var(--white);margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--dark);font-family:var(--serif)}
.stat-card .label{font-size:12px;color:var(--gray);margin-top:2px}
.prop-list{display:grid;gap:16px}
.prop-card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:200px 1fr auto;transition:box-shadow .2s}
.prop-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.06)}
.prop-img{width:200px;height:160px;object-fit:cover;background:var(--light)}
.prop-info{padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.prop-title{font-size:16px;font-weight:600;margin-bottom:6px}
.prop-address{font-size:13px;color:var(--gray);margin-bottom:10px}
.prop-details{display:flex;gap:12px;font-size:13px;color:var(--gray)}
.prop-details span{display:flex;align-items:center;gap:4px}
.prop-price{font-size:18px;font-weight:700;color:var(--blue)}
.prop-actions{padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-left:1px solid var(--border);min-width:140px}
.prop-score{font-size:28px;font-weight:800;color:var(--blue);font-family:var(--serif)}
.prop-source{font-size:11px;color:var(--gray);padding:3px 10px;background:var(--light);border-radius:50px}
.btn-fav{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn-fav:hover{border-color:var(--blue);color:var(--blue)}
.btn-fav.active{background:#fef2f2;border-color:#ef4444;color:#ef4444}
.loading{text-align:center;padding:60px;color:var(--gray)}
.loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--gray)}
.empty .icon{font-size:48px;margin-bottom:16px}
@media(max-width:768px){
.dash{padding:16px}
.stats-row{grid-template-columns:repeat(2,1fr)}
.prop-card{grid-template-columns:1fr}
.prop-img{width:100%;height:180px}
.prop-actions{flex-direction:row;border-left:none;border-top:1px solid var(--border);min-width:auto;padding:12px 16px}
.dash-header{flex-direction:column;gap:16px;align-items:stretch}
.profile-top{flex-direction:column;gap:16px}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-brand">
    <svg viewBox="0 0 56 60" width="22" height="26"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c4a6e"/><stop offset=".6" stop-color="#0369a1"/><stop offset="1" stop-color="#059669"/></linearGradient></defs><path d="M6 52L16 8L28 26L40 8L50 52L40 44L28 48L16 44Z" fill="url(#wg)"/><circle cx="21" cy="32" r="2.5" fill="#fafbfc"/><circle cx="35" cy="32" r="2.5" fill="#fafbfc"/></svg>
    Lou Garou
  </div>
  <div class="nav-user" id="navUser" style="display:none">
    <span id="userEmail"></span>
    <button class="btn-logout" onclick="logout()">Déconnexion</button>
  </div>
</nav>
<div id="authScreen" class="auth-screen">
  <h2>Connexion</h2>
  <p>Accédez à votre espace Lou</p>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="authEmail" placeholder="votre@email.com">
  </div>
  <div class="form-group">
    <label>Mot de passe</label>
    <input type="password" id="authPw" placeholder="Mot de passe">
  </div>
  <button class="btn-primary" id="authBtn" onclick="doAuth()">Se connecter</button>
  <div class="auth-error" id="authError"></div>
  <div class="auth-toggle">
    <span id="authToggleText">Pas encore de compte ?</span>
    <a id="authToggleLink" onclick="toggleAuthMode()">Créer un compte</a>
  </div>
</div>
<div id="dashboard" style="display:none">
  <div class="dash">
    <div class="dash-header">
      <h1>Mon Dashboard</h1>
      <button class="btn-search" onclick="runSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Lancer une recherche
      </button>
    </div>
    <div id="profileSection"></div>
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="num" id="statTotal">—</div><div class="label">Biens trouvés</div></div>
      <div class="stat-card"><div class="num" id="statNew">—</div><div class="label">Nouveaux</div></div>
      <div class="stat-card"><div class="num" id="statFav">—</div><div class="label">Favoris</div></div>
      <div class="stat-card"><div class="num" id="statSources">—</div><div class="label">Portails</div></div>
    </div>
    <div id="propList" class="prop-list">
      <div class="empty"><div class="icon">🐺</div>Lancez une recherche pour voir les résultats</div>
    </div>
  </div>
</div>
<script>
var API = '';
var isLogin = true;
var token = null;
var currentProfile = null;
(function(){
  try {
    token = localStorage.getItem('lou_token');
    if (token) showDashboard();
    var profile = localStorage.getItem('lou_profile');
    if (profile && !token) {
      var p = JSON.parse(profile);
      document.getElementById('authEmail').value = p.email || '';
    }
  } catch(e) {}
})();
function toggleAuthMode() {
  isLogin = !isLogin;
  document.querySelector('#authScreen h2').textContent = isLogin ? 'Connexion' : 'Créer un compte';
  document.getElementById('authBtn').textContent = isLogin ? 'Se connecter' : 'Créer mon espace';
  document.getElementById('authToggleText').textContent = isLogin ? 'Pas encore de compte ?' : 'Déjà un compte ?';
  document.getElementById('authToggleLink').textContent = isLogin ? 'Créer un compte' : 'Se connecter';
}
function doAuth() {
  var email = document.getElementById('authEmail').value.trim();
  var pw = document.getElementById('authPw').value;
  var errEl = document.getElementById('authError');
  errEl.style.display = 'none';
  if (!email || !pw) { errEl.textContent = 'Remplissez tous les champs'; errEl.style.display = 'block'; return; }
  if (!API) {
    try {
      localStorage.setItem('lou_token', 'demo_' + Date.now());
      localStorage.setItem('lou_user', JSON.stringify({email: email, name: ''}));
      token = 'demo';
    } catch(e) {}
    showDashboard();
    return;
  }
  var endpoint = isLogin ? '/api/login' : '/api/signup';
  var body = {email: email, password: pw};
  if (!isLogin) {
    try {
      var profile = JSON.parse(localStorage.getItem('lou_profile') || '{}');
      if (profile.criteria) body.criteria = profile.criteria;
    } catch(e) {}
  }
  fetch(API + endpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) {
      token = d.token;
      try {
        localStorage.setItem('lou_token', token);
        localStorage.setItem('lou_user', JSON.stringify(d.user));
      } catch(e) {}
      showDashboard();
    } else {
      errEl.textContent = d.error || 'Erreur';
      errEl.style.display = 'block';
    }
  }).catch(function() {
    errEl.textContent = 'Erreur réseau';
    errEl.style.display = 'block';
  });
}
function showDashboard() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('navUser').style.display = 'flex';
  try {
    var user = JSON.parse(localStorage.getItem('lou_user') || '{}');
    document.getElementById('userEmail').textContent = user.email || '';
  } catch(e) {}
  loadProfiles();
}
function loadProfiles() {
  if (!API) {
    try {
      var profile = JSON.parse(localStorage.getItem('lou_profile') || '{}');
      if (profile.criteria) {
        renderProfile(profile);
        renderDemoProperties(profile);
      }
    } catch(e) {}
    return;
  }
  fetch(API + '/api/profiles', {
    headers: {'Authorization': 'Bearer ' + token}
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.profiles && d.profiles.length > 0) {
      currentProfile = d.profiles[0];
      renderProfile({criteria: currentProfile, score: {t: currentProfile.lou_score, g: currentProfile.lou_grade}});
      loadProperties(currentProfile.id);
      loadStats(currentProfile.id);
    }
  });
}
function renderProfile(data) {
  var c = data.criteria || {};
  var sc = data.score || {t: 0, g: 'D'};
  var gc = sc.g === 'A' ? '#059669' : sc.g === 'B' ? '#0369a1' : '#f59e0b';
  document.getElementById('profileSection').innerHTML =
    '<div class="profile-card"><div class="profile-top"><div class="profile-criteria">' +
    (c.canton ? '<span class="tag tag-blue">' + (c.canton || '') + '</span>' : '') +
    (c.city ? '<span class="tag tag-blue">' + (c.city || c.ci || '') + '</span>' : '') +
    (c.type || c.property_type ? '<span class="tag">' + (c.type || c.property_type) + '</span>' : '') +
    (c.transaction || c.transaction_type ? '<span class="tag">' + (c.transaction || c.transaction_type) + '</span>' : '') +
    (c.budget ? '<span class="tag">' + c.budget + '</span>' : '') +
    (c.rooms ? '<span class="tag">' + c.rooms + '</span>' : '') +
    '</div>' +
    (sc.t ? '<div class="score-badge"><div class="score-num">' + sc.t + '<small style="font-size:16px;color:#94a3b8">/100</small></div><span class="score-grade" style="background:' + gc + '">Classe ' + sc.g + '</span></div>' : '') +
    '</div></div>';
}
function renderDemoProperties(data) {
  var c = data.criteria || {};
  var city = c.city || c.ci || 'Lausanne';
  var type = c.type || c.ty || 'Appartement';
  var tx = c.transaction || c.tr || 'Achat';
  var isRent = tx.toLowerCase() === 'location';
  var portals = ['Homegate', 'ImmoScout24', 'Comparis', 'Flatfox', 'Newhome'];
  var streets = ['Rue du Lac', 'Avenue de la Gare', 'Chemin des Vignes', 'Route de Berne', 'Place du Marché', 'Rue de Genève', 'Avenue des Alpes', 'Chemin du Soleil'];
  var props = [];
  for (var i = 0; i < 8; i++) {
    var score = 90 - i * 5 - Math.floor(Math.random() * 8);
    var price = isRent ? (1200 + Math.floor(Math.random() * 2000)) : (450000 + Math.floor(Math.random() * 800000));
    var rooms = 2 + Math.floor(Math.random() * 4);
    var surface = 45 + Math.floor(Math.random() * 80);
    props.push({
      title: type + ' ' + rooms + ' pièces — ' + streets[i],
      address: streets[i] + ' ' + (1 + Math.floor(Math.random() * 50)) + ', ' + city,
      price: price,
      price_unit: isRent ? 'CHF/mois' : 'CHF',
      rooms: rooms,
      surface_m2: surface,
      lou_score: score,
      lou_grade: score >= 85 ? 'A' : score >= 70 ? 'B' : score >= 55 ? 'C' : 'D',
      source: portals[i % portals.length],
      is_favorite: 0
    });
  }
  document.getElementById('statTotal').textContent = props.length;
  document.getElementById('statNew').textContent = props.length;
  document.getElementById('statFav').textContent = '0';
  document.getElementById('statSources').textContent = portals.length;
  renderPropertyList(props);
}
function loadProperties(profileId) {
  fetch(API + '/api/properties/' + profileId, {
    headers: {'Authorization': 'Bearer ' + token}
  }).then(function(r) { return r.json(); }).then(function(d) {
    renderPropertyList(d.properties || []);
  });
}
function loadStats(profileId) {
  fetch(API + '/api/stats/' + profileId, {
    headers: {'Authorization': 'Bearer ' + token}
  }).then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById('statTotal').textContent = d.total || 0;
    document.getElementById('statNew').textContent = d.new_count || 0;
    document.getElementById('statFav').textContent = d.favorites || 0;
    document.getElementById('statSources').textContent = d.sources || 0;
  });
}
function renderPropertyList(properties) {
  var el = document.getElementById('propList');
  if (!properties || !properties.length) {
    el.innerHTML = '<div class="empty"><div class="icon">🐺</div>Aucun bien trouvé. Lancez une recherche !</div>';
    return;
  }
  el.innerHTML = properties.map(function(p, i) {
    var gc = (p.lou_grade || 'D') === 'A' ? '#059669' : p.lou_grade === 'B' ? '#0369a1' : '#f59e0b';
    var priceStr = p.price ? p.price.toLocaleString('fr-CH') + ' ' + (p.price_unit || 'CHF') : '—';
    return '<div class="prop-card">' +
      '<div class="prop-img" style="background:linear-gradient(135deg,#e2e8f0,#f1f5f9);display:flex;align-items:center;justify-content:center;font-size:32px;color:#94a3b8">🟠</div>' +
      '<div class="prop-info">' +
        '<div class="prop-title">' + (p.title || 'Bien immobilier') + '</div>' +
        '<div class="prop-address">' + (p.address || '') + '</div>' +
        '<div class="prop-details">' +
          (p.rooms ? '<span>🛏 ' + p.rooms + ' pièces</span>' : '') +
          (p.surface_m2 ? '<span>📐 ' + p.surface_m2 + ' m²</span>' : '') +
        '</div>' +
        '<div class="prop-price" style="margin-top:8px">' + priceStr + '</div>' +
      '</div>' +
      '<div class="prop-actions">' +
        '<div class="prop-score" style="color:' + gc + '">' + (p.lou_score || '—') + '</div>' +
        '<span class="prop-source">' + (p.source || '') + '</span>' +
        '<button class="btn-fav' + (p.is_favorite ? ' active' : '') + '" onclick="toggleFav(' + (p.id || i) + ',this)">♥ Favori</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
function toggleFav(id, btn) {
  btn.classList.toggle('active');
  if (API && currentProfile) {
    fetch(API + '/api/favorite/' + id, {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token}
    });
  }
}
function runSearch() {
  if (!currentProfile && !API) {
    alert('Mode démo — le backend n\'est pas encore connecté.\nLes résultats affichés sont simulés.');
    return;
  }
  if (currentProfile && API) {
    document.getElementById('propList').innerHTML = '<div class="loading"><div class="spinner"></div>Lou scanne les portails...</div>';
    fetch(API + '/api/search/' + currentProfile.id, {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token}
    }).then(function(r) { return r.json(); }).then(function(d) {
      loadProperties(currentProfile.id);
      loadStats(currentProfile.id);
    });
  }
}
function logout() {
  try {
    localStorage.removeItem('lou_token');
    localStorage.removeItem('lou_user');
  } catch(e) {}
  token = null;
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('navUser').style.display = 'none';
}
</script>
</body>
</html>
