<script type="text/babel" data-presets="react" data-src="v5/tokens.jsx">
// bonhome D1 V5 — tokens recalés sur la V2 validée
// V4 → V5 : aubergine SUPPRIMÉE. Retour à la palette validée :
//   sauge = ancre émotionnelle + accent CTA (matches, avatar, point wordmark)
//   terracotta = signal exceptionnel (≤ 1/écran : "Nouveau", urgences, badges)
//   pas de 3e couleur signature.

// ─── LIGHT MODE (validé V2) ─────────────────────────────────
const L = {
  ink:      '#1F2420',  // 13.4:1 sur paper — AAA
  inkSoft:  '#4A5350',  // 8.2:1 sur paper — AAA
  inkMute:  '#7A827E',  // 4.7:1 sur paper — AA

  paper:    '#FAF7F1',
  cream:    '#F5F1EA',
  line:     '#E4DFD4',
  lineSoft: '#EEE9DE',

  sage:     '#6B8A74',  // ancre émotionnelle — matches, avatar, CTA, point wordmark
  sageDeep: '#3E5847',  // 8.3:1 — AAA
  sageSoft: '#D6E0D4',

  accent:     '#C9986A', // terracotta — signal ≤ 1/écran (badges Nouveau, urgences)
  accentSoft: '#EED9C2',
  accentInk:  '#7A4F2E', // 6.1:1 — AA pour texte sur soft
};

// ─── DARK MODE ──────────────────────────────────────────────
const D = {
  ink:      '#F0ECE4',
  inkSoft:  '#9EA29B',
  inkMute:  '#6E7570',

  paper:    '#13161A',
  cream:    '#1A1E1B',
  line:     '#2A2E2A',
  lineSoft: '#20231F',

  sage:     '#9DBBA4',
  sageDeep: '#C3D6C6',
  sageSoft: '#2A3A30',

  accent:     '#D4A27A',
  accentSoft: '#3A2E25',
  accentInk:  '#F0C9A6',
};

// Alias ACCENTS — terracotta seule, plus d'aubergine.
const ACCENTS = {
  terracotta: {
    name: 'Terracotta douce',
    hex: L.accent,
    soft: L.accentSoft,
    ink: L.accentInk,
    contrastNote: 'Contraste 6.1:1 (AA) sur accent-soft — usage signal uniquement',
    vibe: 'Chaleur, signal exceptionnel. Maximum 1 occurrence par écran.',
  },
};

const CSS_LIGHT_VARS = `:root {
  /* Neutrals */
  --ink: ${L.ink};
  --ink-soft: ${L.inkSoft};
  --ink-mute: ${L.inkMute};
  --paper: ${L.paper};
  --cream: ${L.cream};
  --line: ${L.line};
  --line-soft: ${L.lineSoft};

  /* Sauge — ancre émotionnelle + CTA primaire */
  --sage: ${L.sage};
  --sage-deep: ${L.sageDeep};
  --sage-soft: ${L.sageSoft};

  /* Terracotta — signal exceptionnel (≤ 1/écran) */
  --accent: ${L.accent};
  --accent-soft: ${L.accentSoft};
  --accent-ink: ${L.accentInk};

  /* Type */
  --font-display: "Fraunces", "Cormorant Garamond", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: ${D.ink};
    --ink-soft: ${D.inkSoft};
    --ink-mute: ${D.inkMute};
    --paper: ${D.paper};
    --cream: ${D.cream};
    --line: ${D.line};
    --line-soft: ${D.lineSoft};
    --sage: ${D.sage};
    --sage-deep: ${D.sageDeep};
    --sage-soft: ${D.sageSoft};
    --accent: ${D.accent};
    --accent-soft: ${D.accentSoft};
    --accent-ink: ${D.accentInk};
  }
}`;

Object.assign(window, { L, D, ACCENTS, CSS_LIGHT_VARS });

</script>
<script type="text/babel" data-presets="react" data-src="v5/primitives.jsx">
// V5 primitives — wordmark VALIDÉ (depuis itérations.html · D1Logo)
// Fraunces 400, chevron SVG sur le 2e "o", point final sauge.
// Aucun "o" italique coloré, aucun chevron Inter — strictement la V2 validée.

function Wordmark({ size = 48, color, markColor, pointColor, showChevron = true }) {
  const ink = color;
  const sage = markColor;
  const point = pointColor || sage;
  return (
    <span style={{
      fontFamily: '"Fraunces", "Cormorant Garamond", Georgia, serif',
      fontSize: size,
      fontWeight: 400,
      letterSpacing: '-0.035em',
      color: ink,
      lineHeight: 1,
      display: 'inline-flex',
      alignItems: 'baseline',
      whiteSpace: 'nowrap',
    }}>
      <span>b</span>
      <span>o</span>
      <span>n</span>
      <span>h</span>
      <span style={{ position: 'relative', display: 'inline-block' }}>
        <span>o</span>
        {showChevron && (
          <svg
            viewBox="0 0 24 24"
            width={size * 0.32}
            height={size * 0.32}
            style={{
              position: 'absolute',
              left: '50%',
              top: `-${size * 0.18}px`,
              transform: 'translateX(-50%)',
              pointerEvents: 'none',
            }}
          >
            <path d="M2 12 L12 3 L22 12" stroke={sage} strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
      </span>
      <span>m</span>
      <span>e</span>
      <span style={{ color: point }}>.</span>
    </span>
  );
}

function Chevron({ size = 14, color, strokeWidth = 2, style = {} }) {
  return (
    <svg width={size} height={size * 0.6} viewBox="0 0 20 12" style={{ display: 'inline-block', ...style }}>
      <path d="M2 10 L10 3 L18 10" stroke={color} strokeWidth={strokeWidth} fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function ChevronBullet({ color, children, size = 13 }) {
  return (
    <div style={{ display: 'flex', gap: 10, alignItems: 'baseline', fontSize: size, lineHeight: 1.55 }}>
      <Chevron size={10} color={color} style={{ position: 'relative', top: -1, flexShrink: 0 }}/>
      <span>{children}</span>
    </div>
  );
}

function ChevronDivider({ color, opacity = 0.4, width = 180 }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      gap: 8, margin: '20px 0', opacity,
    }}>
      <div style={{ height: 1, flex: 1, maxWidth: width, background: color }}/>
      <Chevron size={12} color={color}/>
      <div style={{ height: 1, flex: 1, maxWidth: width, background: color }}/>
    </div>
  );
}

function Monogram({ size = 64, color, accent }) {
  return (
    <svg width={size} height={size} viewBox="0 0 64 64">
      <path
        d="M12 34 L32 16 L52 34"
        stroke={color} strokeWidth="2.4"
        fill="none" strokeLinecap="round" strokeLinejoin="round"
      />
      <path
        d="M16 34 L16 52 L48 52 L48 34"
        stroke={color} strokeWidth="2.4"
        fill="none" strokeLinecap="round" strokeLinejoin="round"
      />
      {accent && <circle cx="32" cy="42" r="2.4" fill={accent}/>}
    </svg>
  );
}

function LouAvatar({ size = 32, bg, fg }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: bg,
      color: fg,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: size * 0.5, fontFamily: '"Fraunces", Georgia, serif',
      fontWeight: 400,
      flexShrink: 0,
    }}>L</div>
  );
}

Object.assign(window, { Wordmark, Chevron, ChevronBullet, ChevronDivider, Monogram, LouAvatar });

</script>
<script type="text/babel" data-presets="react" data-src="v5/layout.jsx">
// V3 layout — print-native, stacked sections, each its own A3 landscape page.

const DC = {
  bg: '#e8e4dd',
  title: '#1F2420',
  subtitle: '#6B6B6B',
  label: '#A09886',
  postitBg: '#FCEDA7',
  postitText: '#3A3620',
};

// Print wrapper — one root
function PrintRoot({ children }) {
  return (
    <div style={{
      background: '#fff',
      fontFamily: '"Inter", system-ui, sans-serif',
      padding: 40,
    }}>{children}</div>
  );
}

// Section — one page (A3 landscape ≈ 1550 × 1080 at 96dpi with margin)
function Section({ number, title, subtitle, children, pageBreak = true }) {
  return (
    <div className={pageBreak ? 'print-section' : ''} style={{
      marginBottom: 80,
      position: 'relative',
      padding: '0 40px',
      minHeight: 960,
    }}>
      <div style={{
        display: 'flex', alignItems: 'baseline', gap: 18,
        marginBottom: 20,
        borderBottom: `1px solid ${L.line}`,
        paddingBottom: 14,
      }}>
        {number && (
          <div style={{
            fontFamily: 'ui-monospace, monospace',
            fontSize: 11, color: L.sageDeep,
            letterSpacing: '0.2em', textTransform: 'uppercase',
            fontWeight: 600,
          }}>{number}</div>
        )}
        <div style={{ flex: 1 }}>
          <div style={{
            fontFamily: '"Fraunces", Georgia, serif',
            fontSize: 34, fontWeight: 300, color: L.ink,
            letterSpacing: '-0.025em', lineHeight: 1.05,
          }}>{title}</div>
          {subtitle && (
            <div style={{ fontSize: 13, color: L.inkSoft, marginTop: 4 }}>{subtitle}</div>
          )}
        </div>
      </div>

      {children}
    </div>
  );
}

// Artboard — scaled card, portrait or landscape
function Artboard({ label, children, width, height, maxW = 1100, style = {} }) {
  const scale = width > maxW ? maxW / width : 1;
  return (
    <div className="print-artboard" style={{
      position: 'relative', flexShrink: 0,
      marginBottom: 28,
    }}>
      {label && (
        <div style={{
          marginBottom: 6,
          fontSize: 10, fontWeight: 600, color: L.inkSoft,
          letterSpacing: '0.12em', textTransform: 'uppercase',
        }}>{label}</div>
      )}
      <div style={{
        width: width * scale, height: height * scale, overflow: 'hidden',
      }}>
        <div style={{
          transform: `scale(${scale})`, transformOrigin: '0 0',
          width, height,
          borderRadius: 4,
          border: `1px solid ${L.line}`,
          boxShadow: '0 2px 4px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06)',
          overflow: 'hidden',
          background: '#fff',
          ...style,
        }}>{children}</div>
      </div>
    </div>
  );
}

// Post-it — inline block, rotated, breaks avoided
function PostIt({ children, rotate = -2, width = 240 }) {
  return (
    <div style={{
      display: 'inline-block', width,
      background: DC.postitBg, padding: '14px 16px',
      fontFamily: '"Comic Sans MS", "Marker Felt", "Segoe Print", cursive',
      fontSize: 13, lineHeight: 1.45, color: DC.postitText,
      boxShadow: '0 2px 8px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
      transform: `rotate(${rotate * 0.35}deg)`,
      breakInside: 'avoid',
    }}>{children}</div>
  );
}

// Grid — flexible row/col container
function Row({ children, gap = 24, align = 'flex-start', wrap = true, style = {} }) {
  return (
    <div style={{
      display: 'flex', gap, alignItems: align,
      flexWrap: wrap ? 'wrap' : 'nowrap',
      ...style,
    }}>{children}</div>
  );
}

function Col({ children, gap = 12, style = {} }) {
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap, ...style,
    }}>{children}</div>
  );
}

Object.assign(window, { PrintRoot, Section, Artboard, PostIt, Row, Col, DC });

</script>
<script type="text/babel" data-presets="react" data-src="v5/mockups.jsx">
