<script type="text/babel" data-presets="react" data-src="v5p/wordmark.jsx">
// Wordmark paramétrable par palette — structure identique au D1Logo validé
// Fraunces opsz chunky + chevron SVG au-dessus 2e "o" + point anchor

function WordmarkP({ size = 72, P, showChevron = true, showDot = true, color, markColor, dotColor }) {
  const ink = color ?? P.ink;
  const mark = markColor ?? P.anchor;
  const dot  = dotColor ?? P.anchor;
  const chevW = size * 0.48;
  const chevH = size * 0.22;
  return (
    <span style={{
      fontFamily: '"Fraunces", Georgia, serif',
      fontSize: size,
      fontWeight: 400,
      fontVariationSettings: `"opsz" ${Math.min(144, size)}`,
      color: ink,
      letterSpacing: '-0.03em',
      lineHeight: 1,
      display: 'inline-flex',
      alignItems: 'baseline',
      whiteSpace: 'nowrap',
    }}>
      <span>b</span><span>o</span><span>n</span><span>h</span>
      <span style={{ position: 'relative', display: 'inline-block' }}>
        <span>o</span>
        {showChevron && (
          <svg
            width={chevW}
            height={chevH}
            viewBox="0 0 24 12"
            style={{
              position: 'absolute',
              top: `-${size * 0.30}px`,
              left: '50%',
              transform: 'translateX(-50%)',
              overflow: 'visible',
            }}
          >
            <path d="M2 10 L12 2 L22 10" stroke={mark} strokeWidth="2.1" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
      </span>
      <span>m</span><span>e</span>
      {showDot && <span style={{ color: dot, fontWeight: 500 }}>.</span>}
    </span>
  );
}

// Version "gradient" : le chevron et le point portent un dégradé (pour Aurora).
// Fallback à couleur pleine si pas de gradient passé.
function WordmarkPGrad({ size = 72, P, gradientId = 'wgrad' }) {
  const chevW = size * 0.48;
  const chevH = size * 0.22;
  // Parser le linear-gradient pour en sortir les stops
  const stops = parseLinearGradient(P.gradient);
  return (
    <span style={{
      fontFamily: '"Fraunces", Georgia, serif',
      fontSize: size,
      fontWeight: 400,
      fontVariationSettings: `"opsz" ${Math.min(144, size)}`,
      color: P.ink,
      letterSpacing: '-0.03em',
      lineHeight: 1,
      display: 'inline-flex',
      alignItems: 'baseline',
      whiteSpace: 'nowrap',
    }}>
      <span>b</span><span>o</span><span>n</span><span>h</span>
      <span style={{ position: 'relative', display: 'inline-block' }}>
        <span>o</span>
        <svg
          width={chevW}
          height={chevH}
          viewBox="0 0 24 12"
          style={{
            position: 'absolute',
            top: `-${size * 0.30}px`,
            left: '50%',
            transform: 'translateX(-50%)',
            overflow: 'visible',
          }}
        >
          <defs>
            <linearGradient id={gradientId} x1="0" y1="0" x2="1" y2="0">
              {stops.map((s, i) => (
                <stop key={i} offset={s.offset} stopColor={s.color}/>
              ))}
            </linearGradient>
          </defs>
          <path d="M2 10 L12 2 L22 10" stroke={`url(#${gradientId})`} strokeWidth="2.4" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </span>
      <span>m</span><span>e</span>
      <span style={{
        background: P.gradient,
        WebkitBackgroundClip: 'text',
        WebkitTextFillColor: 'transparent',
        backgroundClip: 'text',
        fontWeight: 500,
      }}>.</span>
    </span>
  );
}

// Minimal parser: "linear-gradient(135deg, #A 0%, #B 50%, #C 100%)"
function parseLinearGradient(g) {
  const m = g.match(/linear-gradient\([^,]+,\s*(.+)\)$/);
  if (!m) return [{ offset: '0%', color: '#000' }, { offset: '100%', color: '#000' }];
  const parts = m[1].split(/,(?![^(]*\))/).map(s => s.trim());
  return parts.map(p => {
    const [color, off] = p.split(/\s+/);
    return { color, offset: off || '0%' };
  });
}

Object.assign(window, { WordmarkP, WordmarkPGrad });

</script>

                background: s.hex,

                border: s.hex.toLowerCase() === P.paper.toLowerCase() ? `1px solid ${P.line}` : 'none',
              }}/>
              <div style={{ fontSize: 10.5, fontWeight: 600, color: P.ink, marginBottom: 2 }}>{s.name}</div>
              <div style={{ fontSize: 9, fontFamily: 'ui-monospace, monospace', color: P.inkMute, letterSpacing: '0.04em' }}>{s.hex}</div>
              <div style={{ fontSize: 9.5, color: P.inkSoft, marginTop: 4, lineHeight: 1.3 }}>{s.role}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Gradient showcase (si Aurora) */}
      {isAurora && (
        <div style={{
          display: 'grid',
          gridTemplateColumns: '1fr 1fr',
          gap: 16,
          marginBottom: 36,
        }}>
          <div style={{
            height: 80,
            background: P.gradient,
            borderRadius: 10,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '0 22px',
            color: P.paper,
          }}>
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', fontFamily: 'ui-monospace, monospace' }}>Gradient · signature</span>
            <span style={{ fontSize: 10, opacity: 0.9, fontFamily: 'ui-monospace, monospace' }}>135° · lilas → turquoise → pêche</span>
          </div>
          <div style={{
            height: 80,
            background: P.gradientSoft,
            borderRadius: 10,
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '0 22px',
            color: P.ink,
          }}>
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', fontFamily: 'ui-monospace, monospace' }}>Gradient · soft (fonds)</span>
            <span style={{ fontSize: 10, color: P.inkMute, fontFamily: 'ui-monospace, monospace' }}>Pour photos, bulles, surfaces</span>
          </div>
        </div>
      )}

      {/* Mockups row */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: '1.3fr 1fr 1fr',
        gap: 18,
        alignItems: 'start',
      }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
          <HeaderMockup P={P} useGradientOnActive={useGradient}/>
          <ListingCard P={P} useGradientOnCTA={useGradient}/>
        </div>
        <ChatBubbles P={P}/>
        <BannerMockup P={P} useGradient={useGradient}/>
      </div>

      {/* Dot list — où la couleur apparaît */}
      <div style={{
        marginTop: 32,
        padding: '18px 22px',
        background: P.paper,
        border: `1px solid ${P.line}`,
        borderRadius: 10,
        display: 'grid',
        gridTemplateColumns: 'repeat(4, 1fr)',
        gap: 18,
      }}>
        {[
          { label: 'Wordmark', val: `Chevron + point : ${P.anchor}${isAurora ? ' (gradient sur point)' : ''}` },
          { label: 'CTA principal', val: useGradient ? 'Gradient 135° lilas→pêche' : `Bouton : ${P.anchor}` },
          { label: 'Avatar / badges', val: `Fond : ${P.anchor} · texte : ${P.paper}` },
          { label: 'Signal (≤ 1/écran)', val: `${P.signal} — ex: badge « Nouveau »` },
        ].map(item => (
          <div key={item.label}>
            <div style={{
              fontSize: 9.5, letterSpacing: '0.14em', textTransform: 'uppercase',
              color: P.inkMute, fontWeight: 600, marginBottom: 6,
              fontFamily: 'ui-monospace, monospace',
            }}>{item.label}</div>
            <div style={{ fontSize: 12, color: P.inkSoft, lineHeight: 1.4 }}>{item.val}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function PageCover() {
  const { sage } = window.PALETTES;
  return (
    <section style={{
      background: sage.paper,
      padding: '72px 56px 48px',
      fontFamily: '"Inter", sans-serif',
      color: sage.ink,
      borderBottom: `1px solid ${sage.line}`,
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 80 }}>
        <WordmarkP size={44} P={sage}/>
        <div style={{
          fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase',
          color: sage.inkMute, fontWeight: 500,
          fontFamily: 'ui-monospace, monospace',
        }}>Avril 2026 · Neuchâtel · V5·P</div>
      </div>

      <div style={{ maxWidth: 900 }}>
        <div style={{
          fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase',
          color: sage.inkMute, fontWeight: 600,
          fontFamily: 'ui-monospace, monospace',
          marginBottom: 22,
        }}>Exploration · 4 palettes · même identité</div>
        <div style={{
          fontFamily: '"Fraunces", Georgia, serif',
          fontVariationSettings: '"opsz" 144',
          fontSize: 88, fontWeight: 300,
          letterSpacing: '-0.04em', lineHeight: 1.02,
          color: sage.ink,
          marginBottom: 28,
        }}>
          Une seule marque,<br/>
          <span style={{ fontStyle: 'italic', color: sage.anchorDeep }}>quatre températures.</span>
        </div>
        <div style={{
          fontSize: 17, lineHeight: 1.55, color: sage.inkSoft, maxWidth: 720,
        }}>
          Wordmark identique. Typographie identique. Layout identique.
          Seule la couleur change — et avec elle, la personnalité de la marque.
        </div>
      </div>

      <div style={{
        marginTop: 64,
        display: 'grid',
        gridTemplateColumns: 'repeat(4, 1fr)',
        gap: 16,
      }}>
        {[
          { t: 'Sauge · V5 validé', bg: sage.anchor },
          { t: 'Mer du Nord · bleus', bg: '#2E5ABF' },
          { t: 'Aurora · gradient fluo', bg: 'linear-gradient(135deg, #5B4FBF 0%, #2FCAD4 50%, #FF9E7A 100%)' },
          { t: 'NCS 2026 · couleur de l\'année', bg: 'linear-gradient(135deg, #2A6670 0%, #8FA780 55%, #C96A44 100%)' },
        ].map((item, i) => (
          <div key={item.t} style={{
            padding: '14px 16px',
            background: sage.paper,
            border: `1px solid ${sage.line}`,
            borderRadius: 10,
            display: 'flex', alignItems: 'center', gap: 12,
          }}>
            <div style={{
              width: 34, height: 34, borderRadius: 8,
              background: item.bg, flexShrink: 0,
            }}/>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 9, letterSpacing: '0.14em', textTransform: 'uppercase', color: sage.inkMute, fontWeight: 600, fontFamily: 'ui-monospace, monospace', marginBottom: 3 }}>0{i+1}</div>
              <div style={{ fontSize: 12, color: sage.ink, fontWeight: 500, lineHeight: 1.3 }}>{item.t}</div>
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

function App() {
  const { sage, nord, aurora, ncs } = window.PALETTES;
  return (
    <div style={{
      maxWidth: 1320,
      margin: '0 auto',
      background: '#FFF',
      boxShadow: '0 1px 0 rgba(0,0,0,0.04)',
    }}>
      <PageCover/>
      <PaletteBlock P={sage}   useGradient={false} isAurora={false} variant="first"/>
      <PaletteBlock P={nord}   useGradient={false} isAurora={false} variant="second"/>
      <PaletteBlock P={aurora} useGradient={true}  isAurora={true}  variant="third"/>
      <PaletteBlock P={ncs}    useGradient={false} isAurora={false} variant="fourth"/>
    </div>
  );
}

Object.assign(window, { App, PaletteBlock, PageCover });

</script>
<script type="text/babel" data-presets="react">
function tryMount() {
  const needed = ['PALETTES','WordmarkP','WordmarkPGrad','HeaderMockup','ListingCard','ChatBubbles','BannerMockup','App'];
  const missing = needed.filter(k => !window[k]);
  if (missing.length) { setTimeout(tryMount, 50); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<window.App/>);
}
tryMount();
</script>
</body>
</html>
