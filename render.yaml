# Bon Home — Render Blueprint
# Deploy with: render blueprint apply

services:
  # Main API
  - type: web
    name: lou-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    # v6.3.3 (R1) : gthread avec 4 threads/worker = 8 requêtes concurrentes
    # au lieu de 2 (sync). Nécessaire parce que ScrapingBee bloque 30s/appel
    # et qu'avec sync seulement 2 users peuvent chatter en même temps.
    # 2 workers × 4 threads = 8, pool DB max = 10 (marge OK).
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lou-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

  # Scraper Cron Job
  - type: cron
    name: lou-scraper
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 16 * * *"  # Every day at 16h UTC = 18h CEST (summer) / 17h CET (winter)
    startCommand: python cron_job.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lou-db
          property: connectionString

  # v6.4.0 — QA Recall Snapshot Cron. Alimente qa_recall_snapshots pour
  # l'endpoint /api/stats/listings-qa (lecture pure, < 100 ms).
  # Remplace le scrape synchrone de l'endpoint (qui timeout en 502 sur
  # Neuchâtel/Boudry depuis pré-beta).
  - type: cron
    name: lou-qa-recall
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 4 * * *"  # Every day at 04h UTC = 06h CEST (summer) / 05h CET (winter)
    startCommand: python3 cron_job_qa_recall.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lou-db
          property: connectionString
      # SCRAPINGBEE_API_KEY : défini manuellement dans le dashboard Render
      # (même valeur que lou-scraper). sync:false évite le leak dans git.
      - key: SCRAPINGBEE_API_KEY
        sync: false
      # QA_RECALL_CITIES : optionnel, défaut en code =
      # "peseux,neuchatel,la-chaux-de-fonds,lausanne,geneve".
      # Override dans le dashboard Render si besoin d'étendre la liste.
      - key: QA_RECALL_CITIES
        sync: false

databases:
  - name: lou-db
    plan: free  # Upgrade to starter ($7/mo) for production
    databaseName: lou_garou
    postgresMajorVersion: "16"
