# Bon Home — Render Blueprint
# Deploy with: render blueprint apply

services:
  # Main API
  - type: web
    name: lou-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lou-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

  # Scraper Cron Job
  - type: cron
    name: lou-scraper
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 */2 * * *"  # Every 2 hours
    startCommand: python cron_job.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lou-db
          property: connectionString

databases:
  - name: lou-db
    plan: free  # Upgrade to starter ($7/mo) for production
    databaseName: lou_garou
    postgresMajorVersion: "16"
